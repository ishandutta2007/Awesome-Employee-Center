<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes circuitPulse {
      0% { stroke-dashoffset: 400; opacity: 0.2; }
      50% { opacity: 0.7; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 1000px 300px; }
    .pill-1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 6s ease-in-out infinite; }
    .pill-3 { animation: floatPill3 5.5s ease-in-out infinite; }
    .circuit-line {
      stroke-dasharray: 80, 20;
      animation: circuitPulse 6s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -1.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="110" r="130" fill="#06b6d4" opacity="0.25" filter="url(#glow)" />
  <circle class="orb-2" cx="980" cy="280" r="160" fill="#8b5cf6" opacity="0.25" filter="url(#glow)" />
  <circle cx="600" cy="200" r="90" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />

  <!-- Animated Circuit Connection Lines -->
  <path class="circuit-line" d="M 50 80 Q 250 160 450 80 T 850 120 T 1150 70" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  <path class="circuit-line" d="M 80 320 Q 300 240 600 330 T 1120 310" fill="none" stroke="#a855f7" stroke-width="1.5" />

  <!-- Floating Dynamic Pills (Background Accent) -->
  <g class="pill-1" transform="translate(140, 60)">
    <rect width="160" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.85" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="36" y="22" fill="#e2e8f0" class="badge-text">⚡ Modern Intranet</text>
  </g>

  <g class="pill-2" transform="translate(900, 75)">
    <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.85" />
    <circle cx="20" cy="17" r="5" fill="#a855f7" />
    <text x="36" y="22" fill="#e2e8f0" class="badge-text">✨ Employee Experience</text>
  </g>

  <g class="pill-3" transform="translate(860, 290)">
    <rect width="190" height="34" rx="17" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" opacity="0.85" />
    <circle cx="20" cy="17" r="5" fill="#06b6d4" />
    <text x="36" y="22" fill="#e2e8f0" class="badge-text">🛠️ Digital Workplace Hub</text>
  </g>

  <g class="pill-1" transform="translate(120, 290)">
    <rect width="170" height="34" rx="17" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" opacity="0.85" />
    <circle cx="20" cy="17" r="5" fill="#ec4899" />
    <text x="36" y="22" fill="#e2e8f0" class="badge-text">🚀 Unified Portals</text>
  </g>

  <!-- Foreground Title and Subtitle Box -->
  <g transform="translate(600, 160)">
    <!-- Main Title -->
    <text text-anchor="middle" y="20" fill="url(#textGrad)" class="title-text" font-size="52" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      Awesome Employee Center
    </text>
    <!-- Subtitle -->
    <text text-anchor="middle" y="65" fill="#e2e8f0" class="sub-text" font-size="20" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.9))">
      Enterprise Intranets • Digital Workplace Portals • EX Platforms • Self-Service Hubs
    </text>
    <!-- Tagline -->
    <text text-anchor="middle" y="100" fill="#94a3b8" class="sub-text" font-size="14" font-weight="500">
      Curated SaaS Solutions &amp; Open-Source Self-Hosted Architectures
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="350" y="365" width="500" height="3" rx="1.5" fill="url(#accentGrad)" />
</svg>
